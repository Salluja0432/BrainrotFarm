name: Luau static validation

on:
  push:
    branches:
      - fix/phase1-strict-datastore-validation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  luau-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install luau-lsp 1.70.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip \
            --output "$RUNNER_TEMP/luau-lsp.zip"
          mkdir -p "$RUNNER_TEMP/luau-lsp"
          unzip -q "$RUNNER_TEMP/luau-lsp.zip" -d "$RUNNER_TEMP/luau-lsp"
          chmod +x "$RUNNER_TEMP/luau-lsp/luau-lsp"
          echo "$RUNNER_TEMP/luau-lsp" >> "$GITHUB_PATH"

      - name: Analyze Roblox Luau sources
        shell: bash
        run: |
          set -euo pipefail
          luau-lsp analyze \
            --platform=roblox \
            --definitions=.github/roblox-globals.d.luau \
            roblox/src/shared/Config.luau \
            roblox/src/server/DataManager.luau \
            roblox/src/server/Main.server.luau
