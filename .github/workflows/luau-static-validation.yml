name: Luau static validation

on:
  push:
    branches:
      - fix/phase1-strict-datastore-validation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  luau-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            --output "$RUNNER_TEMP/rojo.zip"
          mkdir -p "$RUNNER_TEMP/rojo"
          unzip -q "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/rojo"
          chmod +x "$RUNNER_TEMP/rojo/rojo"
          echo "$RUNNER_TEMP/rojo" >> "$GITHUB_PATH"

      - name: Generate Rojo sourcemap
        shell: bash
        run: |
          set -euo pipefail
          rojo sourcemap roblox/default.project.json --output sourcemap.json

      - name: Install luau-lsp 1.70.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip \
            --output "$RUNNER_TEMP/luau-lsp.zip"
          mkdir -p "$RUNNER_TEMP/luau-lsp"
          unzip -q "$RUNNER_TEMP/luau-lsp.zip" -d "$RUNNER_TEMP/luau-lsp"
          chmod +x "$RUNNER_TEMP/luau-lsp/luau-lsp"
          echo "$RUNNER_TEMP/luau-lsp" >> "$GITHUB_PATH"

      - name: Analyze Roblox Luau sources
        shell: bash
        run: |
          set -euo pipefail
          luau-lsp analyze \
            --platform=roblox \
            --sourcemap=sourcemap.json \
            --definitions=.github/roblox-globals.d.luau \
            roblox/src/shared/Config.luau \
            roblox/src/server/DataManager.luau \
            roblox/src/server/Main.server.luau
